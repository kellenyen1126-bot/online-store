<!DOCTYPE html>
<html>
<body>

<h1>Hello</h1>

<button onclick="test()">Click</button>

<p id="demo">0</p>

<img id="img" src="https://picsum.photos/200" width="200">

<script>
let x = 0;

function test() {
  x++;
  document.getElementById("demo").innerHTML = x;

  // 每次換不同圖片（用 random 保證會變）
  document.getElementById("img").src = "https://picsum.photos/200?random=" + x;
}
</script>

</body>
</html>
