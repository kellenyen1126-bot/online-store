<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Stationery Shop</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🛒 Modern Stationery Shop</h1>

  <div class="shop">

    <!-- Pencil -->
    <div class="card">
      <img src="https://as2.ftcdn.net/v2/jpg/01/75/58/65/1000_F_175586544_WEc5HAQXkkgLAb1QRZrPW4LY7Qaw7OKU.jpg" 
           alt="Pencil">

      <h2>Pencil ✏️</h2>
      <div class="price">$10</div>
      <button onclick="addItem('Pencil ✏️', 10)">Add to Cart</button>
    </div>

    <!-- Eraser -->
    <div class="card">
      <img src="data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'>
      <rect width='140' height='140' fill='white'/>
      <rect x='25' y='45' width='90' height='50' rx='10' fill='%23ff8fab'/>
      <rect x='70' y='45' width='45' height='50' rx='10' fill='%23ffb3c1'/>
      <text x='40' y='75' font-size='14' fill='white'>ERASER</text>
      </svg>">

      <h2>Eraser 🧽</h2>
      <div class="price">$15</div>
      <button onclick="addItem('Eraser 🧽', 15)">Add to Cart</button>
    </div>

  </div>

  <!-- CART -->
  <div class="cart">

    <h2>🧾 Shopping Cart</h2>

    <ul id="cartList"></ul>
    <div id="total">$0</div>

    <button class="purchase-btn" onclick="purchase()">Purchase</button>
    <button class="clear" onclick="clearCart()">Clear Cart</button>

  </div>

  <script src="script.js"></script>

</body>
</html>
