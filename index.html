<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Stationery Shop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dfe9f3, #ffffff);
      min-height: 100vh;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 30px;
      color: #222;
    }

    .shop {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .card {
      width: 260px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .card img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .price {
      font-size: 24px;
      color: #ff5722;
      margin-bottom: 15px;
      font-weight: bold;
    }

</html>
