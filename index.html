<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Stationery Shop</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🛒 Modern Stationery Shop</h1>

  <div class="shop">

    <!-- Pencil -->
    <div class="card">
      <img src="https://as2.ftcdn.net/v2/jpg/01/75/58/65/1000_F_175586544_WEc5HAQXkkgLAb1QRZrPW4LY7Qaw7OKU.jpg" 
           alt="Pencil">

      <h2>Pencil ✏️</h2>
      <div class="price">$10</div>
      <button onclick="addItem('Pencil ✏️', 10)">Add to Cart</button>
    </div>

    <!-- Eraser (UPDATED IMAGE) -->
    <div class="card">
      <img src="https://th.bing.com/th/id/OIP.PKKI4eOAoJ_NJXNdIdADbwHaE_?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3" 
           alt="Eraser">

      <h2>Eraser 🧽</h2>
      <div class="price">$15</div>
      <button onclick="addItem('Eraser 🧽', 15)">Add to Cart</button>
    </div>

  </div>

  <!-- CART -->
  <div class="cart">

    <h2>🧾 Shopping Cart</h2>

    <ul id="cartList"></ul>
    <div id="total">$0</div>

    <button class="purchase-btn" onclick="purchase()">Purchase</button>
    <button class="clear" onclick="clearCart()">Clear Cart</button>

  </div>

  <script src="script.js"></script>

</body>
</html>
