<!DOCTYPE html>
<html>
<body style="text-align:center; font-family:Arial;">

<h1>🛒 Stationery Shop</h1>

<button onclick="test()">Add Item</button>

<p>Total Items: <span id="demo">0</span></p>

<img id="img"
     src="https://cdn-icons-png.flaticon.com/512/32/32339.png"
     width="200">

<script>
let x = 0;

// 鉛筆 + 橡皮擦圖片
let images = [
  "https://cdn-icons-png.flaticon.com/512/32/32339.png",
  "https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
];

function test() {
  x++;

  document.getElementById("demo").innerHTML = x;

  // 切換圖片
  let index = x % images.length;

  document.getElementById("img").src = images[index];
}
</script>

</body>
</html>
