<!DOCTYPE html>
<html>
<head>
  <title>Stationery Shop</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f5f5f5;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    img {
      width: 100px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🛒 Stationery Shop</h1>

<div class="container">

  <div class="card">

    <img src="https://cdn-icons-png.flaticon.com/512/32/32339.png">

    <h3>Pencil ✏️</h3>

    <p>$10</p>

    <button onclick="addPencil()">
      Add to Cart
    </button>

  </div>

  <div class="card">

    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">

    <h3>Eraser 🧽</h3>

    <p>$15</p>

    <button onclick="addEraser()">
      Add to Cart
    </button>

  </div>

</div>

<h2>Total: $<span id="total">0</span></h2>

<script>
let total = 0;

function addPencil() {
  total += 10;
  document.getElementById("total").innerText = total;
}

function addEraser() {
  total += 15;
  document.getElementById("total").innerText = total;
}
</script>

</body>
</html>
