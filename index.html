<!DOCTYPE html>
<html>
<head>
  <title>Stationery Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>🛒 Stationery Shop</h1>

<div class="container">

  <!-- ✏️ 鉛筆 -->
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/32/32205.png" alt="鉛筆" width="80">
    <h3>鉛筆 ✏️</h3>
    <p>$10</p>
    <button onclick="addItem('pencil')">加入購物車</button>
  </div>

  <!-- 🧽 橡皮擦 -->
  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/1162/1162456.png" alt="橡皮擦" width="80">
    <h3>橡皮擦 🧽</h3>
    <p>$15</p>
    <button onclick="addItem('eraser')">加入購物車</button>
  </div>

</div>

<hr>

<h2>🧾 購物車</h2>
<ul id="cart"></ul>

<h2>💰 總價：$<span id="total">0</span></h2>

<button onclick="clearCart()">🗑 清空購物車</button>

<script src="script.js"></script>

</body>
</html>
