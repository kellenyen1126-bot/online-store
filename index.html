<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Shop</title>
</head>

<body>

<div id="authBox">
  <h2>Login / Register</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>

  <p id="msg"></p>
</div>

<div id="shopBox" style="display:none;">
  <h1>🛒 Shop</h1>

  <button onclick="logout()">Logout</button>

  <div class="shop">

    <div>
      <h3>Pencil</h3>
      <button onclick="addItem('Pencil',10)">Add</button>
    </div>

    <div>
      <h3>Eraser</h3>
      <button onclick="addItem('Eraser',15)">Add</button>
    </div>

  </div>

  <h2>Cart</h2>
  <ul id="cart"></ul>
  <h3 id="total">$0</h3>

</div>

<!-- IMPORTANT: VITE MODULE -->
<script type="module" src="/main.js"></script>

</body>
</html>
