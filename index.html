<!DOCTYPE html>
<html>
<head>
  <title>Stationery Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>🛒 Stationery Shop</h1>

<div class="container">

  <!-- Pencil -->
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Pencil.svg" alt="Pencil">

    <h3>Pencil ✏️</h3>

    <p>$10</p>

    <button onclick="addItem('pencil')">
      Add to Cart
    </button>
  </div>

  <!-- Eraser -->
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Eraser.svg" alt="Eraser">

    <h3>Eraser 🧽</h3>

    <p>$15</p>

    <button onclick="addItem('eraser')">
      Add to Cart
    </button>
  </div>

</div>

<hr>

<h2>🧾 Shopping Cart</h2>
<ul id="cart"></ul>

<h2>💰 Total: $<span id="total">0</span></h2>

<button onclick="clearCart()">🗑 Clear Cart</button>

<script src="script.js"></script>

</body>
</html>
